services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: rezeptmeister
      POSTGRES_USER: rezeptmeister
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rezeptmeister"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    # Port 8000 is NOT exposed to the host. The FastAPI backend is protected by
    # the INTERNAL_SECRET token and should only be reachable from other containers
    # (Next.js via BACKEND_URL=http://backend:8000). Remove this comment and
    # un-comment the line below ONLY for local debugging:
    # ports:
    #   - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://rezeptmeister:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/rezeptmeister
      UPLOAD_DIR: /app/uploads
      INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET must be set}
    volumes:
      # Only the uploads directory is mounted at runtime.
      # The source tree is NOT mounted so the container uses the
      # immutable image built by `docker compose build`.
      - ./uploads:/app/uploads
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # curl ist im python:3.12-slim-Image nicht enthalten — der Test schlug
      # deshalb dauerhaft fehl ("executable file not found"), obwohl /health
      # sauber mit 200 antwortete. Python liegt ohnehin im Image.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen(
              "http://localhost:8000/health", timeout=4
          ).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
