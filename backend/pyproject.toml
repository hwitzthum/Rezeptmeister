[project]
name = "rezeptmeister-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    # Pinned explicitly (fastapi itself does not set a floor tight enough to
    # exclude vulnerable releases): starlette <1.0.1 is CVE-2026-48710
    # ("BadHost") — an unvalidated Host header lets request.url.path diverge
    # from the actually-routed ASGI path, which breaks any path-based security
    # check (see InternalTokenMiddleware in app/main.py, which exempts /health
    # by comparing request.url.path). <1.3.1 is additionally CVE-2026-54283
    # (request.form() size/field limits silently ignored for urlencoded
    # bodies). 1.3.1 fixes both.
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.5",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.2",
    # Pinned explicitly above the natural floor: Pillow <12.3.0 has multiple
    # native heap-corruption / out-of-bounds-write CVEs (PYSEC-2026-2253..2257,
    # 3451..3496) reachable via PilImage.open() on attacker-controlled bytes in
    # app/routers/ai.py (image analysis / thumbnailing of user-uploaded and
    # URL-imported images). 12.3.0 fixes all of them.
    "Pillow>=12.3.0",
    "google-genai>=1.0.0",
    "beautifulsoup4>=4.12.3",
    # Pinned explicitly: idna is only a transitive dependency (pulled in by
    # httpx/anyio, which perform every outbound HTTPS request this service
    # makes) with no direct floor of our own, so it silently resolved to a
    # vulnerable release. idna <3.15 has PYSEC-2026-215 (an incomplete fix for
    # CVE-2024-3651): a crafted hostname such as "٠" * N hits
    # valid_contexto()'s catastrophic-backtracking regex before the length
    # check rejects it. url_import_service.fetch_and_parse() builds an httpx
    # request from a user-supplied recipe URL, and httpx/anyio IDNA-encode the
    # hostname before connecting — confirmed locally that a ~100k-character
    # crafted hostname hangs idna.encode() well past two minutes, blocking the
    # single-process asyncio event loop for every concurrent request. 3.15
    # fixes it.
    "idna>=3.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.32.0",
    "httpx>=0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
